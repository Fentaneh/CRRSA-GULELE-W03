<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRRSA Appointment</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<img src="logo.png" alt="CRRSA Logo" width="90">

<h2>CRRSA Gulele Woreda 03 Online Appointment</h2>

<p>
የሲቪል ምዝገባ እና የነዋሪነት አገልግሎት/ቀጠሮ መያዝ
</p>

<hr>

</header>

<form id="appointmentForm" onsubmit="createAppointment(event)">

<label>Full Name/ሙሉ ስም</label>
<input id="fullName" type="text" required>

<label>Phone/ስልክ </label>
<input id="phone" type="tel" required>

<label>Select Service/አገልግሎት ይምረጡ</label>

<select id="service" onchange="toggleOtherService()">

<option value="Resident ID">Resident ID</option>
<option value="Birth Registration">Birth Registration</option>
<option value="Marriage Registration">Marriage Registration</option>
<option value="Divorce Registration">Divorce Registration</option>
<option value="Death Registration">Death Registration</option>
<option value="Other">Other/ሌላ </option>

</select>

<div id="otherServiceBox" style="display:none">

<input
id="otherService"
type="text"
placeholder="Specify Service /የሚፈልጉትን ይፃፉ ">

</div>

<label>
Application Date / ያመለከቱበት ቀን
</label>

<input
id="applicationDate"
type="text"
readonly>

<br><br>

<label>
Appointment Date / የቀጠሮ ቀን
</label>

<input
id="appointmentDate"
type="date"
required>

<p id="appointmentEC"></p>
    
<button type="submit">

Submit Appointment

</button>

</form>


<hr>

<div id="appointmentResult"></div>

<div id="qrcode"></div>

<button
id="printButton"
style="display:none"
onclick="printAppointment()">

Print

</button>

<hr>

<h3>Appointments</h3>

<table border="1">

<thead>

<tr>

<th>No</th>

<th>Appointment No</th>

<th>Name</th>

<th>Phone</th>

<th>Service</th>

<th>Application Date</th>

<th>Appointment Date</th>

<th>Status</th>

</tr>

</thead>

<tbody id="appointmentTable">

</tbody>

</table>


<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script src="ethiopian-date.js"></script>
<script src="appointment.js"></script>

</body>
</html>
