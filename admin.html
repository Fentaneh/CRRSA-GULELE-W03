<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
CRRSA Admin Panel
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<header>


<img src="logo.png" width="90">


<h1>
CRRSA Gulele Woreda 03
</h1>


<p>
Admin Appointment Management
</p>


</header>




<div class="container">



<!-- LOGIN SECTION -->


<div id="loginBox">


<h2>
🔐 Admin Login
</h2>



<label>
Username
</label>


<input 
id="username"
type="text"
placeholder="Enter Username">



<br><br>



<label>
Password
</label>


<input 
id="password"
type="password"
placeholder="Enter Password">



<br><br>



<button class="button" onclick="adminLogin()">

Login

</button>


</div>






<!-- ADMIN PANEL -->


<div id="adminPanel" style="display:none;">

<button class="button" onclick="exportToExcel()">
📥 Export to Excel
</button>
<h2>📊 Dashboard</h2>

<div class="dashboard">

<div class="card">
<h3>Total Appointments</h3>
<h1 id="totalAppointments">0</h1>
</div>

<div class="card">
<h3>Today's Appointments</h3>
<h1 id="todayAppointments">0</h1>
</div>

<div class="card">
<h3>This Month</h3>
<h1 id="monthAppointments">0</h1>
</div>

<div class="card">
<h3>Pending</h3>
<h1 id="pendingAppointments">0</h1>
</div>

<div class="card">
<h3>Approved</h3>
<h1 id="approvedAppointments">0</h1>
</div>

<div class="card">
<h3>Rejected</h3>
<h1 id="rejectedAppointments">0</h1>
</div>

</div>

<hr>

<button class="button" onclick="dailyReport()">
📅 Daily Report
</button>

<button class="button" onclick="monthlyReport()">
📆 Monthly Report
</button>

<div id="reportArea"></div>

<hr>
<h2>
📋 Appointment List
</h2>
<div class="search-box">

<input 
id="adminSearch"
type="text"
placeholder="Search Appointment Number / Name">


<button onclick="searchAppointment()">

Search

</button>

</div>



<table border="1" width="100%">


<thead>


<tr>

<th>No</th>

<th>Appointment No</th>

<th>Name</th>

<th>Phone</th>

<th>Service</th>

<th>Date</th>

<th>Status</th>

<th>Action</th>


</tr>


</thead>




<tbody id="adminTable">


</tbody>



</table>



</div>




</div>





<footer>


© 2026 CRRSA Gulele Woreda 03

</footer>






<script src="admin.js"></script>



</body>

</html>
