<header>

<img src="logo.png">

<h1>
CRRSA Gulele Woreda 03
</h1>

<p>
Online Appointment Booking
</p>


</header>



<div class="container">


<h2>
📅 ቀጠሮ መያዣ / Online Appointment
</h2>


<form>


<label>
Full Name / ሙሉ ስም
</label>

<input type="text" required>



<label>
Phone Number / ስልክ ቁጥር
</label>

<input type="tel" required>



<label>
Select Service / አገልግሎት ይምረጡ
</label>


<select>

<option>
Resident ID
</option>

<option>
Birth Registration
</option>

<option>
Marriage Registration
</option>

<option>
Divorce Registration
</option>

<option>
Death Registration
</option>


</select>



<label>
Select Date / ቀን ይምረጡ
</label>

<input type="date" required>



<button class="button">
Submit Appointment
</button>


</form>


</div>
