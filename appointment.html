<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Online Appointment Booking
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<header>


<select id="language">

<option value="en">
English
</option>

<option value="am">
አማርኛ
</option>

<option value="om">
Afaan Oromoo
</option>

</select>


<img src="logo.png">


<h1>
AACRRSA Woreda 03
</h1>


<p>
Online Appointment Booking / ቀጠሮ መያዣ
</p>


</header>



<div class="container">


<h2>
📅 Online Appointment Booking
</h2>



<form id="appointmentForm" 
onsubmit="createAppointment(event)">



<label>
Full Name / ሙሉ ስም
</label>


<input 
id="fullName"
type="text"
required>



<label>
Phone Number / ስልክ ቁጥር
</label>


<input 
id="phone"
type="tel"
required>




<label>
Select Service / አገልግሎት ይምረጡ
</label>


<label>Select Service / አገልግሎት ይምረጡ</label>

<select id="service" onchange="toggleOtherService()">

<option value="Resident ID">Resident ID</option>

<option value="Birth Registration">Birth Registration</option>

<option value="Marriage Registration">Marriage Registration</option>

<option value="Divorce Registration">Divorce Registration</option>

<option value="Death Registration">Death Registration</option>

<option value="Other">Other / ሌላ</option>

</select>

 <div id="otherServiceBox" style="display:none; margin-top:10px;">

<label>የሚፈልጉትን አገልግሎት ይፃፉ</label>

<input
id="otherService"
type="text"
placeholder="Write the service you need">

</div> 

<label>
Select Date / ቀን ይምረጡ
</label>


<input 
id="date"
type="date"
required>




<button class="button">

Submit Appointment

</button>



</form>





<br>


<div id="appointmentResult">

</div>



<div id="qrcode">

</div>



<br>


<button id="printButton"
onclick="printAppointment()"
style="display:none">


🖨 Print Appointment


</button>




<hr>



<h2>

📋 Appointment List

</h2>




<table border="1" width="100%">


<thead>


<tr>

<th>No</th>

<th>Appointment No</th>

<th>Name</th>

<th>Phone</th>

<th>Service</th>

<th>Date</th>

<th>Status</th>


</tr>


</thead>



<tbody id="appointmentTable">


</tbody>


</table>




<br>


<div class="back">


<a href="index.html" class="button">

⬅ Back Home

</a>


</div>



</div>





<footer>

<br>

Created by Fentaneh.D


</footer>





<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">

</script>


<script src="appointment.js">

</script>



</body>

</html>
