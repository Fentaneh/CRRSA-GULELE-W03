<!DOCTYPE html>
<html>

<head>

<title>Online Appointment</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<img src="logo.png">

<h1>
CRRSA Gulele Woreda 03
</h1>

<p>
Online Appointment Booking
</p>


</header>



<div class="container">


<h2>
📅 ቀጠሮ መያዣ / Online Appointment
</h2>

<form id="appointmentForm" onsubmit="createAppointment(event)">


<label>
Full Name / ሙሉ ስም
</label>

<input id="fullName" type="text" required>



<label>
Phone Number / ስልክ ቁጥር
</label>

<input id="phone" type="tel" required>



<label>
Select Service / አገልግሎት ይምረጡ
</label>


<select id="service">

<option>
Resident ID
</option>

<option>
Birth Registration
</option>

<option>
Marriage Registration
</option>

<option>
Divorce Registration
</option>

<option>
Death Registration
</option>

</select>



<label>
Select Date / ቀን ይምረጡ
</label>

<input id="date" type="date" required>



<button class="button">
Submit Appointment
</button>


</form>


<div id="appointmentResult"></div>



<footer>

© 2026 CRRSA Gulele Woreda 03

</footer>

<script src="appointment.js"></script>
</body>

</html>
